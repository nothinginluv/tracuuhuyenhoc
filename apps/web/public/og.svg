<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Tra Cứu Huyền Học — Tử Vi và Bát Tự, minh bạch từng bước tính">
  <rect width="1200" height="630" fill="#fbfaf7"/>
  <rect x="0" y="0" width="1200" height="8" fill="#6b2f3f"/>
  <g transform="translate(1010 330)" opacity="0.55">
    <circle r="150" fill="none" stroke="#efe7d6" stroke-width="14"/>
    <path d="M0 -150 A 150 150 0 0 1 0 150 A 75 75 0 0 1 0 0 A 75 75 0 0 0 0 -150 Z" fill="#efe7d6"/>
