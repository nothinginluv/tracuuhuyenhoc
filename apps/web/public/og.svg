<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="tracuuhuyenhoc — Tử Vi và Bát Tự, minh bạch từng bước tính">
  <rect width="1200" height="630" fill="#fbfaf7"/>
  <rect x="0" y="0" width="1200" height="8" fill="#6b2f3f"/>
  <text x="1080" y="560" font-family="Songti SC, Noto Serif CJK SC, SimSun, serif" font-size="300" text-anchor="middle" fill="#efe7d6">紫</text>
  <text x="88" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#201d18">tracuuhuyenhoc</text>
  <text x="90" y="304" font-family="Georgia, Times New Roman, serif" font-size="42" fill="#3d3830">Tử Vi · Bát Tự</text>
  <text x="90" y="366" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#6b6357">Lá số minh bạch từng bước tính.</text>
  <text x="90" y="410" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#6b6357">Mọi quy ước công khai · mọi kết luận có dẫn nguồn.</text>
  <rect x="90" y="462" width="86" height="2" fill="#c9bda6"/>
  <text x="90" y="512" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8a8172">Chuẩn lịch Trung Quốc · múi giờ lịch sử Việt Nam · 63 tỉnh trước 2025</text>
</svg>
